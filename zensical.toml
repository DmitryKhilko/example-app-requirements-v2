# ==========================================================================
# zensical.toml — конфигурация сайта требований (Zensical, подход Documentation as Code)
#
# Порядок разделов:
#   1. [project]            — сведения о сайте и репозитории
#   2. Меню (nav)           — формируется скриптом, вручную не редактируется
#   3. [project.theme]      — тема: каталог custom/, язык, логотип, возможности, шрифты, цветовые схемы
#   4. [project.extra]      — значения для шаблонов и скриптов (трекер, статусы)
#   5. Расширения Markdown  — вкладки, вставка файлов, предпросмотр ссылок, иконки и др.
#
# Что где лежит: документы аналитиков и изображения — в docs/; всё остальное (шаблон main.html, стили css/,
# скрипты js/ и py/) — в каталоге custom/. Подробнее — в README.md.
# ==========================================================================

# --- 1. САЙТ И РЕПОЗИТОРИЙ ---
[project]
site_name = "EDI-Flow: автоматизированная информационная система EDI-провайдера"
site_description = "Пример организации требований с использованием подхода Documentation as Code"
site_url = "https://dmitrykhilko.github.io/example-app-requirements-v2/"
site_author = "Дмитрий Хилько"
# Ссылка на репозиторий в шапке и кнопка «Править страницу» (content.action.edit): адрес правки = repo_url + edit_uri + путь к файлу
repo_url = "https://github.com/DmitryKhilko/example-app-requirements-v2"
repo_name = "GitHub"
edit_uri = "edit/main/docs/"

# --- 2. МЕНЮ ---
# Блок между маркерами формирует скрипт генерации при сборке (CI). Маркеры BEGIN/END не удалять и не переименовывать.
# Меню лежит в [project]: заголовки таблиц пишутся как [[project.nav]] и [[project.nav."Раздел"]].
# Запись [[nav]] без префикса project создаёт ключ вне [project], и тогда Zensical выводит все файлы подряд.
# BEGIN GENERATED NAV — не редактируйте вручную

[[project.nav]]
"О продукте" = "index.md"

[[project.nav]]
"Проект" = "project/index.md"

[[project.nav]]
  [[project.nav."Требования"]]
  "Глоссарий" = "requirements/business-context/glossary.md"

  [[project.nav."Требования"]]
  "Бизнес-требования" = "requirements/business-context/business-requirements.md"

  [[project.nav."Требования"]]
  "Глобальные требования" = [
      "requirements/global/index.md",
      {"Дизайн-система" = ["requirements/global/design-system/index.md", 
      {"Бренд-бук" = "requirements/global/design-system/brandbook.md"}, 
      {"UI-kit" = "requirements/global/design-system/ui-kit.md"}]},
      {"Всплывающие сообщения (toast)" = "requirements/global/sf-g-toast/index.md"}
  ]

  [[project.nav."Требования"]]
  "Реестр требований" = [
      "requirements/features/index.md",
      {"Справочник стран" = ["requirements/features/country/index.md", 
      {"Общие" = "requirements/features/country/f/index.md"}, 
      {"Создание" = "requirements/features/country/sf-create/index.md"}]}
  ]

[[project.nav]]
"Архив" = "requirements-archive/index.md"

[[project.nav]]
  [[project.nav."Методология"]]
  "Глоссарий" = "methodology/glossary.md"

  [[project.nav."Методология"]]
  "Стандарт создания требований к ПО" = "methodology/standard-requirements.md"

  [[project.nav."Методология"]]
  "Взаимосвязь требований к ПО" = "methodology/relationships-requirements.md"

# END GENERATED NAV


# --- 3. ТЕМА ---
[project.theme]
# Каталог custom/ — единственное место для всего, что не является документами: шаблон main.html, стили (css/), скрипты (js/, py/).
# Zensical берёт extra_css и extra_javascript только из docs/, поэтому стили и скрипты встраивает в страницы шаблон custom/main.html;
# строки extra_css / extra_javascript здесь не нужны. Тёмно-синюю тёмную схему задаёт custom/css/extra.css.
custom_dir = "custom"
language = "ru"

# Логотип в заголовке сайта и значок вкладки браузера. Пути относительно docs/ (так их разрешает Zensical), файл лежит в docs/assets/.
# BEGIN GENERATED LOGO
logo = "assets/logo.png"
favicon = "assets/logo.png"
# END GENERATED LOGO

# Все возможности включаются ОДНИМ списком внутри [project.theme]
features = [
    # навигация
    "navigation.instant",            # переходы между страницами без перезагрузки
    "navigation.instant.prefetch",   # подгрузка страницы при наведении на ссылку
    "navigation.instant.progress",   # индикатор загрузки страницы
    "navigation.tracking",           # адрес страницы обновляется якорем текущего раздела при прокрутке
    "navigation.tabs",               # разделы верхнего уровня — вкладки в шапке
    "navigation.tabs.sticky",        # вкладки остаются на экране при прокрутке
    "navigation.prune",              # из HTML страницы удаляются элементы свёрнутых групп меню
    "navigation.path",               # «хлебные крошки» над заголовком страницы
    "navigation.indexes",            # index.md группы открывается по клику на название группы
    "navigation.top",                # кнопка «Наверх»
    "toc.follow",                    # правое меню прокручивается за активным разделом
    # поиск
    "search.suggest",                # подсказки при вводе запроса
    "search.highlight",              # подсветка найденных слов на странице
    "search.share",                  # кнопка «Поделиться» результатами поиска
    # контент
    "content.code.copy",             # кнопка копирования кода
    "content.code.annotate",         # аннотации в блоках кода
    "content.tooltips",              # всплывающие подсказки (в том числе для сокращений abbr)
    "content.action.edit",           # кнопка «Править страницу» (нужны repo_url и edit_uri)
    "content.footnote.tooltips",     # текст сноски во всплывающем окне
]

[project.theme.font]
text = "Nunito"
code = "Fira Code"

# Цветовые схемы переключаются кнопкой в шапке; по умолчанию берётся схема системы (prefers-color-scheme).
# Фон тёмной схемы (тёмно-синий) задаёт custom/css/extra.css.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Включить тёмную тему"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Включить светлую тему"

# --- 4. ЗНАЧЕНИЯ ДЛЯ ШАБЛОНОВ И СКРИПТОВ ---
# Читаются паспортом спецификации и скриптом генерации; сами по себе на странице не выводятся.
[project.extra.tracker]
# Адрес задач в трекере: ссылка в «паспорте» спецификации строится как task_url + номер из поля task_id
# (например, "https://github.bmf/khilko/app_requirements/issues/" + "1"). Адрес должен оканчиваться на «/».
task_url = "https://github.bmf/khilko/app_requirements-v2/issues/"

[project.extra.status]
# Статусы фич (поле status в спецификациях), жизненный цикл SDLC
backlog = "Бэклог"
analysis = "Анализ"
ready = "Готово к разработке"
development = "Разработка"
released = "Реализовано"
archived = "Архив"
# Статусы статей базы знаний, не являющихся фичами (например, glossary.md)
draft = "Черновик"
review = "На проверке"
published = "Опубликовано"

# --- 5. РАСШИРЕНИЯ MARKDOWN ---
# Примечания (!!! note), сворачиваемые блоки (??? note), сокращения, разметка внутри HTML-блоков
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.abbr]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

# Код: подсветка, код в строке, диаграммы Mermaid (блок ```mermaid)
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# Вкладки (=== "Название") и чек-листы (- [ ] пункт)
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

# Вставка файлов в index.md: --8<-- "путь/от/docs/файл.md" (вкладки пакетов требований); пути считаются от docs/
[project.markdown_extensions.pymdownx.snippets]
base_path = ["docs"]
check_paths = true

# Иконки и эмодзи (:lucide-book-open:, :material-check:)
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

# Окно предпросмотра при наведении на ссылку: включено для всех ссылок на страницы *.md.
# sources.exclude — страницы, ИЗ которых ссылки окна не получают: все index.md (стартовая страница, индексы разделов и модулей),
# где ссылки на спецификации задаются явно атрибутом data-preview, и releases.md (страница «Релизы», пока не подключена).
[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = ["**/*.md"]
# sources.exclude = ["index.md", "**/index.md", "releases.md"]

